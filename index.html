<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beneath the Lie - by Aman Fatima</title>

    <!-- Urdu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #0b0807;
            color: #d4c5a9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(50, 20, 30, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 50%, rgba(20, 30, 50, 0.3) 0%, transparent 70%);
            transition: all 0.4s ease;
        }

        /* ===== URDU MODE ===== */
        body.urdu {
            font-family: 'Noto Nastaliq Urdu', 'Georgia', serif;
            direction: rtl;
            text-align: right;
        }

        body.urdu .chapter-content p {
            text-indent: 0;
        }

        body.urdu .chapter-content p:first-of-type::first-letter {
            float: none;
            font-size: inherit;
            margin-right: 0;
            color: inherit;
        }

        body.urdu .toc-item {
            direction: rtl;
        }

        body.urdu .nav-btn {
            font-family: 'Noto Nastaliq Urdu', 'Arial', sans-serif;
        }

        body.urdu .chapter-number,
        body.urdu .chapter-indicator,
        body.urdu .toc h2 {
            font-family: 'Noto Nastaliq Urdu', 'Arial', sans-serif;
        }

        body.urdu .title {
            font-family: 'Noto Nastaliq Urdu', 'Georgia', serif;
            letter-spacing: 2px;
        }

        body.urdu .subtitle {
            letter-spacing: 3px;
            text-transform: none;
        }

        body.urdu .author {
            font-family: 'Noto Nastaliq Urdu', 'Georgia', serif;
            font-style: normal;
        }

        body.urdu .toc {
            border-left: none;
            border-right: 3px solid #a8886a;
        }

        body.urdu .toc:hover {
            border-right-color: #dcc09a;
        }

        body.urdu .toc h2 {
            text-transform: none;
            letter-spacing: 2px;
        }

        body.urdu .toc-item:hover {
            padding-left: 0;
            padding-right: 10px;
        }

        body.urdu .toc-item .ch-num {
            font-family: 'Noto Nastaliq Urdu', 'Arial', sans-serif;
        }

        body.urdu .toc-item .ch-title {
            font-style: normal;
        }

        body.urdu .chapter-title {
            font-family: 'Noto Nastaliq Urdu', 'Georgia', serif;
        }

        body.urdu .chapter-content {
            font-size: 1.2rem;
            line-height: 2.2;
        }

        body.urdu .chapter-content p {
            text-indent: 0;
        }

        body.urdu .nav-bar {
            direction: rtl;
        }

        body.urdu .nav-btn {
            text-transform: none;
            letter-spacing: 1px;
        }

        body.urdu .footer {
            font-family: 'Noto Nastaliq Urdu', 'Arial', sans-serif;
            letter-spacing: 1px;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(15, 12, 10, 0.94);
            border: 1px solid rgba(180, 140, 100, 0.12);
            border-radius: 14px;
            padding: 45px 55px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a8886a, #dcc09a, #a8886a, transparent);
        }

        /* ===== LANGUAGE TOGGLE ===== */
        .lang-toggle-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(60, 50, 40, 0.3);
            border: 1px solid rgba(180, 140, 100, 0.15);
            color: #b8a898;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .lang-btn:hover {
            background: rgba(168, 136, 106, 0.15);
            border-color: #a8886a;
            color: #f2e4d0;
        }

        .lang-btn.active {
            background: rgba(168, 136, 106, 0.2);
            border-color: #dcc09a;
            color: #f2e4d0;
            box-shadow: 0 0 20px rgba(168, 136, 106, 0.05);
        }

        .lang-divider {
            color: #4a3f35;
            font-size: 0.8rem;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(180, 140, 100, 0.08);
            margin-bottom: 30px;
        }

        .book-icon {
            font-size: 44px;
            margin-bottom: 8px;
            display: block;
            opacity: 0.5;
            letter-spacing: 10px;
        }

        .title {
            font-size: 3.6rem;
            font-weight: 700;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #f2e4d0, #bfa385);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Georgia', 'Times New Roman', serif;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #7a6a5a;
            font-size: 1rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 4px;
        }

        .author {
            font-size: 1.6rem;
            margin-top: 14px;
            letter-spacing: 3px;
            color: #dcc09a;
            font-weight: 400;
            font-style: italic;
        }

        .author span {
            color: #f2e4d0;
            font-style: normal;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(200, 170, 130, 0.15);
        }

        /* ===== TABLE OF CONTENTS ===== */
        .toc {
            background: rgba(30, 25, 20, 0.5);
            border-radius: 10px;
            padding: 25px 30px;
            margin: 20px 0 30px 0;
            border-left: 3px solid #a8886a;
            transition: all 0.3s ease;
        }

        .toc:hover {
            border-left-color: #dcc09a;
        }

        .toc h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #a8886a;
            margin-bottom: 16px;
            font-weight: 400;
            font-family: 'Arial', sans-serif;
        }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 5px 25px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            cursor: pointer;
            color: #b8a898;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(180, 140, 100, 0.04);
            font-size: 0.95rem;
        }

        .toc-item:hover {
            color: #f2e4d0;
            padding-left: 10px;
            border-bottom-color: rgba(180, 140, 100, 0.2);
        }

        .toc-item .ch-num {
            color: #6a5a4a;
            font-size: 0.75rem;
            font-weight: bold;
            min-width: 38px;
            font-family: 'Arial', sans-serif;
        }

        .toc-item .ch-title {
            font-style: italic;
        }

        /* ===== READING AREA ===== */
        .chapter-display {
            padding: 10px 0;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .chapter-number {
            color: #6a5a4a;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-family: 'Arial', sans-serif;
        }

        .chapter-title {
            font-size: 2.2rem;
            color: #f2e4d0;
            margin-top: 6px;
            font-weight: 400;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .chapter-content {
            font-size: 1.15rem;
            line-height: 2;
            color: #d4c5a9;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 1.4em;
            text-indent: 2.2em;
        }

        .chapter-content p:first-of-type {
            text-indent: 0;
        }

        .chapter-content p:first-of-type::first-letter {
            font-size: 4.2rem;
            float: left;
            line-height: 0.9;
            margin-right: 14px;
            color: #dcc09a;
            font-weight: 700;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ===== NAVIGATION ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 28px;
            border-top: 1px solid rgba(180, 140, 100, 0.08);
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(60, 50, 40, 0.35);
            border: 1px solid rgba(180, 140, 100, 0.12);
            color: #b8a898;
            padding: 13px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 300;
            min-width: 150px;
            text-align: center;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(168, 136, 106, 0.15);
            border-color: #a8886a;
            color: #f2e4d0;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
        }

        .chapter-indicator {
            color: #6a5a4a;
            font-size: 0.85rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 3px;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(60, 50, 40, 0.35);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a8886a, #dcc09a);
            width: 5%;
            transition: width 0.6s ease;
            border-radius: 2px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #4a3f35;
            font-size: 0.7rem;
            letter-spacing: 3px;
            font-family: 'Arial', sans-serif;
            border-top: 1px solid rgba(180, 140, 100, 0.04);
            padding-top: 25px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 750px) {
            .container {
                padding: 25px 22px;
            }
            .title {
                font-size: 2.4rem;
            }
            .author {
                font-size: 1.3rem;
            }
            .chapter-title {
                font-size: 1.6rem;
            }
            .chapter-content {
                font-size: 1.05rem;
                line-height: 1.85;
            }
            .toc-grid {
                grid-template-columns: 1fr;
            }
            .nav-btn {
                padding: 11px 20px;
                font-size: 0.75rem;
                min-width: 110px;
            }
            .lang-toggle-wrapper {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px 14px;
                border-radius: 10px;
            }
            .title {
                font-size: 1.9rem;
                letter-spacing: 2px;
            }
            .author {
                font-size: 1.1rem;
            }
            .nav-bar {
                flex-direction: column;
                gap: 10px;
            }
            .nav-btn {
                width: 100%;
            }
            .lang-btn {
                padding: 6px 16px;
                font-size: 0.7rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            background: #0b0807;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3028;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a4a3a;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ===== LANGUAGE TOGGLE ===== -->
        <div class="lang-toggle-wrapper">
            <button class="lang-btn active" id="langEn" data-lang="en">🇬🇧 English</button>
            <span class="lang-divider">|</span>
            <button class="lang-btn" id="langUr" data-lang="ur">🇵🇰 اردو</button>
        </div>

        <!-- ===== HEADER ===== -->
        <div class="header">
            <span class="book-icon">✦ ✦ ✦</span>
            <h1 class="title" id="novelTitle">Beneath the Lie</h1>
            <div class="subtitle" id="novelSubtitle">A Mystery Novel</div>
            <div class="author">by <span>AMAN FATIMA</span></div>
        </div>

        <!-- ===== TABLE OF CONTENTS ===== -->
        <div class="toc" id="tableOfContents">
            <h2 id="tocHeading">📖 Table of Contents</h2>
            <div class="toc-grid" id="tocList"></div>
        </div>

        <!-- ===== CHAPTER DISPLAY ===== -->
        <div class="chapter-display" id="chapterDisplay">
            <div class="chapter-header">
                <div class="chapter-number" id="chapterNumber">Chapter 1</div>
                <h2 class="chapter-title" id="chapterTitle">Chapter Title</h2>
            </div>
            <div class="chapter-content" id="chapterContent"></div>
        </div>

        <!-- ===== NAVIGATION ===== -->
        <div class="nav-bar">
            <button class="nav-btn" id="prevBtn" disabled>
                <span id="prevText">← Previous</span>
            </button>
            <span class="chapter-indicator" id="chapterIndicator">1 / 20</span>
            <button class="nav-btn" id="nextBtn">
                <span id="nextText">Next →</span>
            </button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="footer" id="footerText">
            Beneath the Lie &bull; Aman Fatima &bull; All rights reserved
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT - YAHAN SIRF CHAPTER TITLES HAIN, KOI STORY NAHI
    Aap apni story yahan paste karein
    ============================================================ -->
    <script>
        // ================================================================
        //  🔴 SIRF CHAPTER TITLES - KOI STORY NAHI 🔴
        //  Apni story ke liye neeche "contentEn" aur "contentUr" mein
        //  <p>text</p> ke andar paste karein
        // ================================================================

        const chapters = [];

        // 20 EMPTY CHAPTERS - SIRF TITLES
        for (let i = 1; i <= 20; i++) {
            chapters.push({
                number: i,
                titleEn: `Chapter ${i} Title`,
                titleUr: `باب ${i} کا عنوان`,
                contentEn: `
                    <p><strong>📝 Paste your English chapter ${i} text here.</strong></p>
                    <p>Open your PDF, copy the text, and paste it inside these &lt;p&gt; tags.</p>
                    <p>Add as many paragraphs as you need.</p>
                `,
                contentUr: `
                    <p><strong>📝 اپنا اردو باب ${i} کا متن یہاں پیسٹ کریں۔</strong></p>
                    <p>اپنی PDF کھولیں، متن کاپی کریں، اور ان &lt;p&gt; ٹیگز کے اندر پیسٹ کریں۔</p>
                    <p>جتنے پیراگراف چاہیں شامل کریں۔</p>
                `
            });
        }

        // ================================================================
        //  APP - YAHAN KUCH NA BADLEIN
        // ================================================================

        let currentChapter = 0;
        let currentLang = 'en';

        const langText = {
            en: {
                toc: '📖 Table of Contents',
                prev: '← Previous',
                next: 'Next →',
                footer: 'Beneath the Lie • Aman Fatima • All rights reserved',
                subtitle: 'A Mystery Novel'
            },
            ur: {
                toc: '📖 فہرست مضامین',
                prev: '← پچھلا',
                next: 'اگلا →',
                footer: 'بینیس دی لائی • امان فاطمہ • جملہ حقوق محفوظ ہیں',
                subtitle: 'ایک پراسرار ناول'
            }
        };

        function buildTOC() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';
            chapters.forEach((ch, index) => {
                const div = document.createElement('div');
                div.className = 'toc-item';
                const title = currentLang === 'en' ? ch.titleEn : ch.titleUr;
                div.innerHTML = `
                    <span class="ch-num">Ch. ${ch.number}</span>
                    <span class="ch-title">${title}</span>
                `;
                div.addEventListener('click', () => goToChapter(index));
                tocList.appendChild(div);
            });
        }

        function renderChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            currentChapter = index;
            const ch = chapters[index];

            const title = currentLang === 'en' ? ch.titleEn : ch.titleUr;
            const content = currentLang === 'en' ? ch.contentEn : ch.contentUr;

            document.getElementById('chapterNumber').textContent = `Chapter ${ch.number}`;
            document.getElementById('chapterTitle').textContent = title;
            document.getElementById('chapterContent').innerHTML = content;

            document.getElementById('chapterIndicator').textContent = `${ch.number} / ${chapters.length}`;
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === chapters.length - 1);

            const progress = ((index + 1) / chapters.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            document.querySelector('.chapter-display').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function goToChapter(index) {
            if (index >= 0 && index < chapters.length) {
                renderChapter(index);
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.body.classList.toggle('urdu', lang === 'ur');

            document.getElementById('langEn').classList.toggle('active', lang === 'en');
            document.getElementById('langUr').classList.toggle('active', lang === 'ur');

            document.getElementById('tocHeading').textContent = langText[lang].toc;
            document.getElementById('prevText').textContent = langText[lang].prev;
            document.getElementById('nextText').textContent = langText[lang].next;
            document.getElementById('footerText').textContent = langText[lang].footer;
            document.getElementById('novelSubtitle').textContent = langText[lang].subtitle;

            buildTOC();
            renderChapter(currentChapter);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentChapter > 0) goToChapter(currentChapter - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentChapter < chapters.length - 1) goToChapter(currentChapter + 1);
        });

        document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
        document.getElementById('langUr').addEventListener('click', () => setLanguage('ur'));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentChapter > 0) {
                goToChapter(currentChapter - 1);
            } else if (e.key === 'ArrowRight' && currentChapter < chapters.length - 1) {
                goToChapter(currentChapter + 1);
            }
        });

        setLanguage('en');
    </script>

</body>
</html>
