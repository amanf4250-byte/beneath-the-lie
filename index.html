<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beneath the Lie - by Aman Fatima</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            background: #0a0807;
            color: #d4c5a9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(60, 30, 40, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(30, 40, 60, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(40, 20, 30, 0.1) 0%, transparent 70%);
            position: relative;
        }

        /* ===== ANIMATED STARS ===== */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
        }

        /* ===== FLOATING PARTICLES ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: rgba(200, 180, 160, 0.05);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== GLASS CONTAINER ===== */
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(12, 10, 8, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(180, 140, 100, 0.08);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.02),
                0 0 60px rgba(80, 40, 20, 0.03);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(180, 140, 100, 0.2), rgba(220, 192, 154, 0.4), rgba(180, 140, 100, 0.2), transparent);
            border-radius: 50%;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 25%;
            right: 25%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 140, 100, 0.05), transparent);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(180, 140, 100, 0.05);
            margin-bottom: 35px;
            position: relative;
        }

        .header::after {
            content: '✦ ✦ ✦';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 140, 100, 0.15);
            font-size: 0.7rem;
            letter-spacing: 15px;
            background: #0a0807;
            padding: 0 20px;
        }

        .book-icon {
            font-size: 52px;
            margin-bottom: 10px;
            display: block;
            opacity: 0.3;
            letter-spacing: 15px;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        .title {
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #f2e4d0 20%, #bfa385 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Playfair Display', 'Georgia', serif;
            margin-bottom: 4px;
            text-shadow: 0 2px 40px rgba(180, 140, 100, 0.05);
        }

        .subtitle {
            color: rgba(122, 106, 90, 0.4);
            font-size: 0.85rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 300;
            font-family: 'Arial', sans-serif;
        }

        .author {
            font-size: 1.6rem;
            margin-top: 16px;
            letter-spacing: 5px;
            color: rgba(220, 192, 154, 0.5);
            font-weight: 400;
            font-style: italic;
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        .author span {
            color: #f2e4d0;
            font-style: normal;
            font-weight: 700;
            letter-spacing: 8px;
            text-shadow: 0 0 50px rgba(200, 170, 130, 0.05);
            position: relative;
        }

        .author span::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 170, 130, 0.15), transparent);
        }

        /* ===== TABLE OF CONTENTS ===== */
        .toc {
            background: rgba(30, 25, 20, 0.25);
            border-radius: 16px;
            padding: 28px 32px;
            margin: 25px 0 35px 0;
            border-left: 3px solid rgba(180, 140, 100, 0.15);
            transition: all 0.4s ease;
        }

        .toc:hover {
            border-left-color: rgba(200, 170, 130, 0.3);
            background: rgba(30, 25, 20, 0.35);
        }

        .toc h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: rgba(168, 136, 106, 0.4);
            margin-bottom: 18px;
            font-weight: 400;
            font-family: 'Arial', sans-serif;
        }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 4px 25px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
            color: rgba(184, 168, 152, 0.5);
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(180, 140, 100, 0.02);
            font-size: 0.95rem;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
        }

        .toc-item:hover {
            color: #f2e4d0;
            padding-left: 12px;
            border-bottom-color: rgba(180, 140, 100, 0.06);
        }

        .toc-item .ch-num {
            color: rgba(106, 90, 74, 0.3);
            font-size: 0.7rem;
            font-weight: bold;
            min-width: 38px;
            font-family: 'Arial', sans-serif;
        }

        .toc-item .ch-title {
            font-style: italic;
        }

        /* ===== CHAPTER DISPLAY ===== */
        .chapter-display {
            padding: 15px 0;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chapter-display .icon {
            font-size: 56px;
            margin-bottom: 12px;
            opacity: 0.2;
        }

        .chapter-display h2 {
            font-size: 2.2rem;
            color: #f2e4d0;
            font-weight: 400;
            font-family: 'Playfair Display', 'Georgia', serif;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .chapter-display .ch-desc {
            color: rgba(184, 168, 152, 0.35);
            font-size: 0.95rem;
            font-style: italic;
        }

        .pdf-download-btn {
            display: inline-block;
            margin-top: 18px;
            background: rgba(168, 136, 106, 0.06);
            border: 1px solid rgba(180, 140, 100, 0.1);
            color: #dcc09a;
            padding: 12px 36px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-family: 'Arial', sans-serif;
            text-decoration: none;
            transition: all 0.4s ease;
            letter-spacing: 2px;
        }

        .pdf-download-btn:hover {
            background: rgba(168, 136, 106, 0.12);
            border-color: rgba(200, 170, 130, 0.2);
            color: #f2e4d0;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 136, 106, 0.04);
        }

        /* ===== NAVIGATION ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 28px;
            border-top: 1px solid rgba(180, 140, 100, 0.04);
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(60, 50, 40, 0.15);
            border: 1px solid rgba(180, 140, 100, 0.06);
            color: rgba(184, 168, 152, 0.5);
            padding: 14px 34px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Arial', sans-serif;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            min-width: 150px;
            text-align: center;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(168, 136, 106, 0.06);
            border-color: rgba(180, 140, 100, 0.12);
            color: #f2e4d0;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            transform: none !important;
        }

        .chapter-indicator {
            color: rgba(106, 90, 74, 0.3);
            font-size: 0.8rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 4px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(60, 50, 40, 0.15);
            margin-top: 22px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(180, 140, 100, 0.03), transparent);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(168, 136, 106, 0.2), rgba(220, 192, 154, 0.4));
            width: 5%;
            transition: width 0.8s ease;
            border-radius: 4px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -3px;
            top: -2px;
            width: 6px;
            height: 6px;
            background: rgba(220, 192, 154, 0.3);
            border-radius: 50%;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 35px;
            color: rgba(74, 63, 53, 0.25);
            font-size: 0.6rem;
            letter-spacing: 5px;
            font-family: 'Arial', sans-serif;
            border-top: 1px solid rgba(180, 140, 100, 0.02);
            padding-top: 28px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            background: #0a0807;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(60, 50, 40, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(90, 74, 58, 0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .container {
                padding: 35px 30px;
                border-radius: 18px;
            }
            .title {
                font-size: 3.2rem;
                letter-spacing: 5px;
            }
            .author {
                font-size: 1.3rem;
            }
            .chapter-display h2 {
                font-size: 1.8rem;
            }
            .toc-grid {
                grid-template-columns: 1fr;
            }
            .nav-btn {
                padding: 12px 24px;
                font-size: 0.7rem;
                min-width: 120px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
                border-radius: 14px;
            }
            .title {
                font-size: 2.2rem;
                letter-spacing: 3px;
            }
            .subtitle {
                font-size: 0.65rem;
                letter-spacing: 6px;
            }
            .author {
                font-size: 1.1rem;
                letter-spacing: 3px;
            }
            .author span {
                letter-spacing: 4px;
            }
            .chapter-display h2 {
                font-size: 1.4rem;
            }
            .chapter-display .icon {
                font-size: 40px;
            }
            .pdf-download-btn {
                padding: 10px 24px;
                font-size: 0.75rem;
            }
            .nav-bar {
                flex-direction: column;
                gap: 12px;
            }
            .nav-btn {
                width: 100%;
                padding: 12px;
            }
            .toc {
                padding: 18px 16px;
            }
            .toc h2 {
                font-size: 0.7rem;
                letter-spacing: 5px;
            }
            .header::after {
                font-size: 0.5rem;
                letter-spacing: 10px;
                padding: 0 12px;
            }
            .book-icon {
                font-size: 36px;
                letter-spacing: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== STARS ===== -->
    <div id="stars"></div>
    <div id="particles"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <span class="book-icon">✦ ✦ ✦</span>
            <h1 class="title">Beneath the Lie</h1>
            <div class="subtitle">A Mystery Novel</div>
            <div class="author">by <span>AMAN FATIMA</span></div>
        </div>

        <!-- ===== TABLE OF CONTENTS ===== -->
        <div class="toc">
            <h2>📖 Table of Contents</h2>
            <div class="toc-grid" id="tocList"></div>
        </div>

        <!-- ===== CHAPTER DISPLAY ===== -->
        <div class="chapter-display" id="chapterDisplay">
            <div class="icon">📖</div>
            <h2 id="chapterTitle">Chapter 1</h2>
            <p class="ch-desc" id="chapterDesc">Click below to read this chapter</p>
            <a href="#" class="pdf-download-btn" id="pdfDownloadBtn" target="_blank">📥 Download PDF</a>
        </div>

        <!-- ===== NAVIGATION ===== -->
        <div class="nav-bar">
            <button class="nav-btn" id="prevBtn" disabled><span id="prevText">← Previous</span></button>
            <span class="chapter-indicator" id="chapterIndicator">1 / 20</span>
            <button class="nav-btn" id="nextBtn"><span id="nextText">Next →</span></button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="footer">Beneath the Lie • Aman Fatima • All rights reserved</div>
    </div>

    <script>
        // ================================================================
        //  STARS
        // ================================================================
        (function() {
            const s = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.cssText =
                    `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${Math.random()*4+2}s;animation-delay:${Math.random()*3}s`;
                s.appendChild(star);
            }
        })();

        // ================================================================
        //  PARTICLES
        // ================================================================
        (function() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const s = Math.random() * 3 + 1;
                p.style.cssText =
                    `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*15}s`;
                c.appendChild(p);
            }
        })();

        // ================================================================
        //  🔴 YAHAN APNE PDF RAW LINKS DAALEIN 🔴
        // ================================================================

        const pdfLinks = {
            1: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter%201.pdf",
            2: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-2.pdf",
            3: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-3.pdf",
            4: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-4.pdf",
            5: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-5.pdf",
            6: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-6.pdf",
            7: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-7.pdf",
            8: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-8.pdf",
            9: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-9.pdf",
            10: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-10.pdf",
            11: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-11.pdf",
            12: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-12.pdf",
            13: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-13.pdf",
            14: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-14.pdf",
            15: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-15.pdf",
            16: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-16.pdf",
            17: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-17.pdf",
            18: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-18.pdf",
            19: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-19.pdf",
            20: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-20.pdf"
        };

        // ================================================================
        //  CHAPTER TITLES
        // ================================================================

        const titles = [
            "The Message",
            "The Pieces That Never Fit",
            "Shadows of Yesterday",
            "The Cost of Power",
            "Echoes in the Dark",
            "Old Photographs",
            "The Ring",
            "What He Built",
            "You Will Know Soon",
            "The Same Fragrance",
            "The Lie",
            "The Things You Were Never Told",
            "Questions",
            "The Missing Piece",
            "The First Clue",
            "The Secret She Never Told",
            "The Memory",
            "When Everything Fell Apart",
            "The Verdict",
            "One More Chance"
        ];

        // ================================================================
        //  APP
        // ================================================================

        let current = 0;

        function buildTOC() {
            const list = document.getElementById('tocList');
            list.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const div = document.createElement('div');
                div.className = 'toc-item';
                div.innerHTML = `<span class="ch-num">Ch. ${i+1}</span> <span class="ch-title">${titles[i]}</span>`;
                div.onclick = () => goTo(i);
                list.appendChild(div);
            }
        }

        function goTo(index) {
            if (index < 0 || index >= 20) return;
            current = index;
            const num = index + 1;
            document.getElementById('chapterTitle').textContent = `Chapter ${num}: ${titles[index]}`;
            document.getElementById('pdfDownloadBtn').href = pdfLinks[num] || '#';
            document.getElementById('chapterIndicator').textContent = `${num} / 20`;
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === 19);
            document.getElementById('progressFill').style.width = ((num) / 20 * 100) + '%';
            document.querySelector('.chapter-display').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('prevBtn').onclick = () => goTo(current - 1);
        document.getElementById('nextBtn').onclick = () => goTo(current + 1);

        buildTOC();
        goTo(0);
    </script>

</body>
</html>
