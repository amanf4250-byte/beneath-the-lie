<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneath the Lie - Aman Fatima</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', serif;
            background: #0a0807;
            color: #d4c5a9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: rgba(15, 12, 10, 0.85);
            border: 1px solid rgba(180, 140, 100, 0.1);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        h1 {
            font-size: 3rem;
            text-align: center;
            color: #dcc09a;
            letter-spacing: 4px;
            border-bottom: 1px solid rgba(180, 140, 100, 0.1);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .author {
            text-align: center;
            font-size: 1.3rem;
            color: #a8886a;
            margin-bottom: 25px;
        }
        .toc {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 5px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .toc-item {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            color: #b8a898;
            font-size: 0.9rem;
        }
        .toc-item:hover {
            background: rgba(180, 140, 100, 0.1);
            color: #fff;
            padding-left: 18px;
        }
        .toc-item .ch {
            color: #6a5a4a;
            font-weight: bold;
            margin-right: 8px;
        }
        .chapter-box {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid rgba(180, 140, 100, 0.05);
        }
        .chapter-box h2 {
            font-size: 2rem;
            color: #f2e4d0;
            margin-bottom: 8px;
        }
        .chapter-box .vibe {
            font-size: 0.9rem;
            color: rgba(180, 140, 100, 0.4);
            margin-bottom: 15px;
            font-style: italic;
        }
        .pdf-btn {
            display: inline-block;
            background: rgba(180, 140, 100, 0.08);
            border: 1px solid rgba(180, 140, 100, 0.15);
            color: #dcc09a;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .pdf-btn:hover {
            background: rgba(180, 140, 100, 0.15);
            color: #fff;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(180, 140, 100, 0.05);
        }
        .nav-btn {
            background: rgba(60, 50, 40, 0.2);
            border: 1px solid rgba(180, 140, 100, 0.05);
            color: #b8a898;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(180, 140, 100, 0.1);
            color: #fff;
        }
        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .indicator {
            color: #6a5a4a;
            font-size: 0.8rem;
        }
        .progress {
            width: 100%;
            height: 2px;
            background: rgba(60, 50, 40, 0.2);
            margin-top: 15px;
            border-radius: 2px;
        }
        .progress-fill {
            height: 100%;
            width: 5%;
            background: #a8886a;
            transition: width 0.5s;
            border-radius: 2px;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #4a3f35;
            font-size: 0.65rem;
            letter-spacing: 2px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .toc {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>✦ Beneath the Lie ✦</h1>
    <div class="author">by <span style="color:#dcc09a;font-weight:bold;">AMAN FATIMA</span></div>

    <div class="toc" id="tocList"></div>

    <div class="chapter-box" id="chapterBox">
        <h2 id="chapterTitle">Chapter 1</h2>
        <div class="vibe" id="chapterVibe">✦ suspense ✦</div>
        <a href="#" class="pdf-btn" id="pdfBtn" target="_blank">📄 Download PDF</a>
    </div>

    <div class="nav">
        <button class="nav-btn" id="prevBtn" disabled>← Back</button>
        <span class="indicator" id="indicator">1 / 20</span>
        <button class="nav-btn" id="nextBtn">Next →</button>
    </div>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="footer">Beneath the Lie • Aman Fatima</div>

</div>

<script>
    // 🔴 APNE PDF LINKS YAHAN DAALEIN 🔴
    const pdfLinks = {
        1: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter%201.pdf",
        2: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-2.pdf",
        3: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-3.pdf",
        4: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-4.pdf",
        5: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-5.pdf",
        6: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-6.pdf",
        7: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-7.pdf",
        8: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-8.pdf",
        9: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-9.pdf",
        10: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-10.pdf",
        11: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-11.pdf",
        12: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-12.pdf",
        13: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-13.pdf",
        14: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-14.pdf",
        15: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-15.pdf",
        16: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-16.pdf",
        17: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-17.pdf",
        18: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-18.pdf",
        19: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-19.pdf",
        20: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-20.pdf"
    };

    const chapters = [
        "The Message", "The Pieces That Never Fit", "Shadows of Yesterday",
        "The Cost of Power", "Echoes in the Dark", "Old Photographs",
        "The Ring", "What He Built", "You Will Know Soon",
        "The Same Fragrance", "The Lie", "The Things You Were Never Told",
        "Questions", "The Missing Piece", "The First Clue",
        "The Secret She Never Told", "The Memory", "When Everything Fell Apart",
        "The Verdict", "One More Chance"
    ];

    const vibes = [
        "🔮 mystical, suspense", "💔 heartbreak, confusion", "🌑 dark, intense",
        "⚖️ power, betrayal", "😂 dark humor", "📸 nostalgia, sadness",
        "💍 secrets, clues", "🏛️ power, tension", "🕯️ anticipation, fear",
        "🌹 longing, memory", "🗡️ deceit, danger", "📜 revelation, pain",
        "❓ confusion, searching", "🧩 suspense, discovery", "🔍 investigation, hope",
        "🤫 guilt, hidden truths", "🧠 flashbacks, trauma", "💀 grief, collapse",
        "⚖️ justice, finality", "❤️‍🔥 love, new beginning"
    ];

    const themes = [
        "mystery", "emotional", "thriller", "political", "funny",
        "emotional", "mystery", "thriller", "mystery", "emotional",
        "thriller", "emotional", "mystery", "thriller", "mystery",
        "emotional", "emotional", "emotional", "thriller", "romantic"
    ];

    const colors = {
        mystery: { bg: '#0a0807', text: '#d4c5a9' },
        emotional: { bg: '#1a0e12', text: '#f0d4d4' },
        thriller: { bg: '#0e0a0a', text: '#c9b8b8' },
        political: { bg: '#0f0e0c', text: '#c9c0b0' },
        funny: { bg: '#12100e', text: '#d4cdb8' },
        romantic: { bg: '#1a0f14', text: '#f0d4de' },
        dark: { bg: '#0a0807', text: '#b8a8a0' }
    };

    let current = 0;

    function applyTheme(theme) {
        const c = colors[theme] || colors.dark;
        document.body.style.background = c.bg;
        document.body.style.color = c.text;
        document.querySelector('.container').style.borderColor = c.text + '22';
        document.querySelector('.pdf-btn').style.color = c.text;
        document.querySelector('.pdf-btn').style.borderColor = c.text + '33';
    }

    function renderTOC() {
        const list = document.getElementById('tocList');
        list.innerHTML = '';
        chapters.forEach((ch, i) => {
            const div = document.createElement('div');
            div.className = 'toc-item';
            div.innerHTML = `<span class="ch">Ch.${i+1}</span> ${ch}`;
            div.onclick = () => goTo(i);
            list.appendChild(div);
        });
    }

    function goTo(index) {
        if (index < 0 || index >= 20) return;
        current = index;
        document.getElementById('chapterTitle').textContent = `Chapter ${index+1}: ${chapters[index]}`;
        document.getElementById('chapterVibe').textContent = vibes[index];
        document.getElementById('pdfBtn').href = pdfLinks[index+1] || '#';
        document.getElementById('indicator').textContent = `${index+1} / 20`;
        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === 19);
        document.getElementById('progressFill').style.width = ((index+1)/20*100) + '%';
        applyTheme(themes[index]);
        document.getElementById('chapterBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('prevBtn').onclick = () => goTo(current - 1);
    document.getElementById('nextBtn').onclick = () => goTo(current + 1);

    renderTOC();
    goTo(0);
</script>

</body>
</html>
