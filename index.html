<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneath the Lie — by Aman Fatima</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0807;
      color: #e5dcd3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      max-width: 860px;
      width: 100%;
      background: rgba(15, 12, 10, 0.85);
      border: 1px solid rgba(180, 140, 100, 0.06);
      border-radius: 28px;
      padding: 36px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      transition: all 0.3s;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(180, 140, 100, 0.06);
      margin-bottom: 22px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #f0e4d6, #b89a7a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .author {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.12);
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .header .author strong {
      color: #dcc09a;
      font-weight: 500;
    }

    /* LANGUAGE SELECTOR */
    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.15);
      padding: 6px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.4);
    }

    .lang-btn.active {
      background: rgba(184, 154, 122, 0.06);
      border-color: rgba(184, 154, 122, 0.12);
      color: #dcc09a;
    }

    /* TOC */
    .toc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 4px 10px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.01);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      margin-bottom: 28px;
    }

    .toc-item {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.12);
      font-size: 0.78rem;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toc-item:hover {
      background: rgba(255, 255, 255, 0.02);
      color: #dcc09a;
      padding-left: 12px;
    }

    .toc-item .num {
      color: rgba(255, 255, 255, 0.04);
      font-size: 0.6rem;
      font-weight: 600;
      min-width: 28px;
    }

    /* CHAPTER BOX */
    .chapter-box {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .chapter-box.active {
      display: block;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .chapter-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .chapter-header .ch-num {
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.04);
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .chapter-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 400;
      color: #f0e4d6;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .chapter-content {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.05rem;
      line-height: 2;
      color: rgba(232, 221, 208, 0.75);
      text-align: justify;
      padding: 0 2px;
    }

    .chapter-content p {
      margin-bottom: 1.1em;
      text-indent: 2.2em;
    }

    .chapter-content p:first-of-type {
      text-indent: 0;
    }

    .chapter-content p:first-of-type::first-letter {
      font-size: 3.6rem;
      float: left;
      line-height: 0.85;
      margin-right: 12px;
      color: rgba(184, 154, 122, 0.15);
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }

    /* NAV */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.12);
      padding: 8px 22px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.65rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.04);
      color: #dcc09a;
      border-color: rgba(184, 154, 122, 0.08);
    }

    .nav-btn:disabled {
      opacity: 0.1;
      cursor: not-allowed;
    }

    .indicator {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: 3px;
      font-family: 'Inter', sans-serif;
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.02);
      margin-top: 14px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 5%;
      background: rgba(184, 154, 122, 0.12);
      transition: width 0.5s ease;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.02);
      font-size: 0.5rem;
      letter-spacing: 3px;
      font-family: 'Inter', sans-serif;
      border-top: 1px solid rgba(255, 255, 255, 0.005);
      padding-top: 18px;
    }

    /* ARABIC / URDU MODE */
    body.ar .chapter-content {
      font-family: 'Noto Sans Arabic', 'Georgia', serif;
      direction: rtl;
      text-align: right;
    }
    body.ar .chapter-content p { text-indent: 0; }
    body.ar .chapter-content p:first-of-type::first-letter {
      float: none;
      font-size: inherit;
      margin-right: 0;
      color: inherit;
    }
    body.ar .chapter-header h2 {
      font-family: 'Noto Sans Arabic', 'Playfair Display', serif;
    }

    body.ur .chapter-content {
      font-family: 'Noto Nastaliq Urdu', 'Georgia', serif;
      direction: rtl;
      text-align: right;
    }
    body.ur .chapter-content p { text-indent: 0; }
    body.ur .chapter-content p:first-of-type::first-letter {
      float: none;
      font-size: inherit;
      margin-right: 0;
      color: inherit;
    }
    body.ur .chapter-header h2 {
      font-family: 'Noto Nastaliq Urdu', 'Playfair Display', serif;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      .container { padding: 20px 16px; border-radius: 20px; }
      .header h1 { font-size: 2rem; }
      .chapter-header h2 { font-size: 1.4rem; }
      .chapter-content { font-size: 0.95rem; line-height: 1.9; }
      .chapter-content p:first-of-type::first-letter { font-size: 2.8rem; }
      .toc { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); padding: 12px; }
      .lang-btn { font-size: 0.6rem; padding: 4px 14px; }
      .nav-btn { padding: 6px 14px; font-size: 0.55rem; }
    }

    @media (max-width: 450px) {
      .container { padding: 14px 10px; border-radius: 16px; }
      .header h1 { font-size: 1.6rem; }
      .chapter-content { font-size: 0.85rem; line-height: 1.8; }
      .chapter-content p:first-of-type::first-letter { font-size: 2.2rem; margin-right: 6px; }
      .toc { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 2px; padding: 8px; }
      .toc-item { font-size: 0.65rem; }
      .lang-btn { font-size: 0.5rem; padding: 3px 10px; }
      .nav-btn { padding: 5px 10px; font-size: 0.5rem; }
      .indicator { font-size: 0.55rem; }
    }
  </style>
</head>

ed you."\nRoman's expression froze.\n"When I look at you, my heart feels heavy. I feel angry... and I don't even know the reason."\nSilence filled the hallway.\n"I don't remember what happened," Elara whispered, "but a part of me keeps telling me to stay away from you."\nRoman lowered his eyes.\nA painful smile appeared on his face.\n"I know," he said quietly.\nAnd somehow... those words hurt more than anything else.\n"I know," Roman said quietly.\nElara frowned.\n"You know?" she repeated. "Then tell me. Tell me what happened that night."\nRoman looked at her for a long moment.\n"I can't."\n"Why not?" she asked, her voice rising.\n"Because if I tell you now, you'll hate me even more."\nA cold breeze passed through the hallway.\nElara crossed her arms.\n"I already hate you."\nFor a second, something painful flashed in Roman's eyes.\n"That's the problem, Elara," he said softly. "You hate me... but you don't even remember why."\nShe looked away.\nFor some reason, seeing the hurt in his eyes made her chest ache.\nRoman took a step toward the old door.\n"The answers you're looking for are behind this door."\nElara looked at it nervously.\n"And if I don't like the truth?"\nRoman's hand stopped on the doorknob.\nHe turned back to her.\n"Then you'll understand why I stayed away for three years."\nSilence.\nNeither of them moved.\nThen, slowly, Roman placed his hand on the handle.\n"Are you ready?" he asked.\nElara took a deep breath and looked at the door.\nShe wasn't sure if she wanted her memories back.\nBut she nodded anyway.`,

\nراستے میں خاموشی چھا گئی۔\n"مجھے یاد نہیں کیا ہوا،" ایلارا نے سرگوشی کی، "لیکن میرا ایک حصہ مجھے بار بار کہتا ہے کہ تم سے دور رہوں۔"\nرومن نے آنکھیں جھکا لیں۔\nایک دردناک مسکراہٹ اس کے چہرے پر آئی۔\n"مجھے معلوم ہے،" اس نے خاموشی سے کہا۔\nاور کسی طرح... وہ الفاظ کسی بھی چیز سے زیادہ تکلیف دہ تھے۔\n"مجھے معلوم ہے،" رومن نے خاموشی سے کہا۔\nایلارا نے ماتھا چڑھایا۔\n"تمہیں معلوم ہے؟" اس نے دہرایا۔ "پھر مجھے بتاؤ۔ مجھے بتاؤ کہ اس رات کیا ہوا تھا۔"\nرومن نے اسے دیر تک دیکھا۔\n"میں نہیں بتا سکتا۔"\n"کیوں نہیں؟" اس نے اونچی آواز میں پوچھا۔\n"کیونکہ اگر میں اب بتا دوں تو تم مجھ سے اور زیادہ نفرت کرو گی۔"\nراستے میں ٹھنڈی ہوا چلی۔\nایلارا نے بازو جوڑ لیے۔\n"میں تم سے پہلے ہی نفرت کرتی ہوں۔"\nایک سیکنڈ کے لیے، رومن کی آنکھوں میں کچھ دردناک چمکا۔\n"یہی مسئلہ ہے، ایلارا،" اس نے نرمی سے کہا۔ "تم مجھ سے نفرت کرتی ہو... لیکن تمہیں یاد بھی نہیں کیوں۔"\nاس نے دوسری طرف دیکھا۔\nکسی وجہ سے، اس کی آنکھوں میں درد دیکھ کر اس کا سینہ درد کرنے لگا۔\nرومن نے پرانے دروازے کی طرف ایک قدم بڑھایا۔\n"تم جن جوابات کی تلاش میں ہو، وہ اس دروازے کے پیچھے ہیں۔"\nایلارا نے گھبرا کر اسے دیکھا۔\n"اور اگر مجھے سچ پسند نہ آیا؟"\nرومن کا ہاتھ دروازے کے ہینڈل پر رک گیا۔\nاس نے اس کی طرف مڑ کر دیکھا۔\n"پھر تم سمجھ جاؤ گی کہ میں تین سال تک کیوں دور رہا۔"\nخاموشی۔\nان میں سے کوئی نہیں ہلا۔\nپھر، آہستہ سے، رومن نے ہینڈل پر ہاتھ رکھا۔\n"کیا تم تیار ہو؟" اس نے پوچھا۔\nایلارا نے گہری سانس لی اور دروازے کی طرف دیکھا۔\nاسے یقین نہیں تھا کہ وہ اپنی یادیں واپس چاہتی ہے۔\nلیکن اس نے پھر بھی سر ہلایا۔`,
      contentAr: ` Beneath the Lies\nبواسطة\nأمان فاطمة\n"كل كذبة تخفي حقيقة،\nولكل حقيقة ثمن."\nالفصل الأول\nالرسالة\nتعلمت إلارا شيئًا واحدًا في وقت مبكر جدًا من الحياة: الثقة يمكن أن تكون خطيرة.\nبدت المدينة جميلة من الخارج. امتلأت الشوارع بالأضواء الساطعة، وضحك الناس في المقاهي، ولعب الأطفال في الحدائق. لكن خلف كل ابتسامة، يمكن أن يكون هناك سر.\nبينما كانت إلارا تسير إلى المنزل من المدرسة في ذلك المساء، اهتز هاتفها فجأة.\nرقم غير معروف: "أعرف ما حدث قبل ثلاث سنوات."\nتجمدت إلارا.\nكانت ثلاث سنوات مضت وقتًا وعدت نفسها ألا تتذكره أبدًا.\nقبل أن تتمكن من الرد، ظهرت رسالة أخرى.\nرقم غير معروف: "إذا كنت تريدين الحقيقة، تعالي إلى المكتبة القديمة عند منتصف الليل. تعالي وحدك."\nسار قشعريرة باردة في عمود إلارا الفقري.\nشخص ما كان يعرف سرها.\nحدقت إلارا في الشاشة، تقرأ الرسالة مرارًا وتكرارًا.\n"أعرف ما حدث قبل ثلاث سنوات."\nبدأت يداها ترتجفان.\nلم يكن من المفترض أن يعرف أحد.\nللحظة، فكرت إلارا في حذف الرسائل والتظاهر بأنها لم ترها أبدًا. لكن الفضول كان أقوى من الخوف.\nفي منتصف الليل بالضبط، وقفت إلارا أمام المكتبة القديمة.\nكان المبنى مهجورًا لسنوات. بدت نوافذه المكسورة مثل عيون مظلمة تراقب من الظلال.\nانفتح الباب ببطء مع صرير.\n"أهلاً؟" نادت إلارا.\nلا إجابة.\nثم...\nطق. طق. طق.\nترددت خطوات من الطابق الثاني.\nكان قلب إلارا ينبض بشدة.\nصعدت الدرج المترب ووجدت ظرفًا واحدًا ملقى على الأرض.\nعلى الجانب الأمامي، مكتوب بالحبر الأحمر، كانت الكلمات:\n"الحقيقة تبدأ هنا."\nوبأيدٍ مرتجفة، فتحته إلارا.\nفي الداخل كانت صورة قديمة.\nتظهر خمسة مراهقين واقفين معًا.\nتعرفت إلارا على أربعة منهم فورًا.\nتم خدش وجه الشخص الخامس.\nفجأة، جاء صوت من الظلام.\n"لقد أتيت أخيرًا."\nاستدارت إلارا بسرعة.\nخرج شخص من الظلال، وجهه مخفي بغطاء أسود.\n"أنت لا تتذكريني، أليس كذلك؟" سأل الغريب.\nقبل أن تتمكن إلارا من الإجابة، انطفأت الأضواء في المكتبة.\nأصبح كل شيء صامتًا.\n"أنت لا تتذكرين تلك الليلة،" قال رومان بهدوء. "لكني أتذكرها."\nقبل أن تتمكن إلارا من طرح سؤال آخر، سمع صوت صرير عالٍ في مكان ما في المكتبة.\nتوقف رومان عن الكلام.\nتبع ذلك صوت آخر.\nخبط خفيف.\nعبست إلارا. "ما كان ذلك؟"\nتغير تعبير رومان فجأة.\nنظر نحو الممر المظلم، يستمع بعناية.\nثم...\nطق.\nخطوة.\nاتسعت عيناه.\nبدون أن ينبس ببنت شفة، أمسك بيد إلارا وسحبها إلى غرفة تخزين صغيرة بجانب الرفوف.\n"رومان، ماذا تفعل؟" همست.\n"شش،" قال وهو يغلق الباب إلى النصف.\nترددت خطوة أخرى في المكتبة.\nاشتد قبضة رومان على يدها.\n"أعتقد أننا لسنا وحدنا،" همس.\nبدأ قلب إلارا يتسارع.\n"ماذا تقصد؟"\nنظر رومان نحو الشق في الباب.\n"أعتقد... هناك شخص ثالث هنا."\nصمت.\nثم اقترب صوت الخطى ببطء.\nلم يجرؤ أي منهما على التنفس.\nاقتربت الخطى أكثر.\nوضع رومان يده على فمها.\n"لا تصدري أي صوت،" همس.\nتوقفت الخطى أمام الباب مباشرة.\nصمت.\nكانت إلارا تسمع نبضات قلبها.\nمرت بضع ثوان.\nثم ابتعدت الخطى ببطء.\nانتظر رومان قليلاً قبل أن يزيل يده.\n"من كان ذلك؟" سألت إلارا بهدوء.\nنظر رومان إلى الممر المظلم، بتعبير لا يمكن قراءته.\n"لا أعرف،" قال بهدوء.\nأخذ نفسًا عميقًا.\n"لكن هذا يعني أننا فاتنا الأوان."\n"ماذا تقصد؟"\nالتفت رومان لينظر إليها.\n"شخص آخر يبحث عن الحقيقة قبلنا."\nأشار رومان ببطء نحو الباب الخشبي القديم.\n"كل شيء بدأ في تلك الغرفة،" قال بهدوء. "وكل شيء انتهى هناك أيضًا."\nحدقت إلارا في الباب، وشعر غريب ينتاب صدرها.\nثم نظرت إليه.\n"لا أعرف لماذا،" قالت بهدوء، "لكن منذ تلك الليلة... أنا أكرهك."\nتجمد تعبير رومان.\n"عندما أنظر إليك، يشعر قلبي بالثقل. أشعر بالغضب... ولا أعرف السبب حتى."\nملأ الصمت الممر.\n"لا أتذكر ما حدث،" همست إلارا، "لكن جزءًا مني يخبرني باستمرار أن أبتعد عنك."\nخفض رومان عينيه.\nظهرت ابتسامة مؤلمة على وجهه.\n"أنا أعلم،" قال بهدوء.\nوبطريقة ما... كانت تلك الكلمات تؤلم أكثر من أي شيء آخر.\n"أنا أعلم،" قال رومان بهدوء.\nعبست إلارا.\n"أنت تعلم؟" كررت. "ثم أخبرني. أخبرني ما حدث تلك الليلة."\nنظر إليها رومان لوقت طويل.\n"لا أستطيع."\n"لماذا لا؟" سألت بصوت مرتفع.\n"لأنني إذا أخبرتك الآن، سوف تكرهينني أكثر."\nمر نسيم بارد في الممر.\nشبكت إلارا ذراعيها.\n"أنا أكرهك بالفعل."\nللحظة، برق شيء مؤلم في عيني رومان.\n"هذه هي المشكلة، إلارا،" قال بهدوء. "أنت تكرهينني... لكنك لا تتذكرين حتى لماذا."\nنظرت بعيدًا.\nلسبب ما، رؤية الألم في عينيه جعل صدرها يؤلمها.\nخطا رومان خطوة نحو الباب القديم.\n"الإجابات التي تبحثين عنها خلف هذا الباب."\nنظرت إليه إلارا بعصبية.\n"وماذا لو لم يعجبني الحقيقة؟"\nتوقفت يد رومان على مقبض الباب.\nالتفت إليها.\n"عندها ستفهمين لماذا ابتعدت ثلاث سنوات."\nصمت.\nلم يتحرك أي منهما.\nثم، ببطء، وضع رومان يده على المقبض.\n"هل أنت مستعدة؟" سأل.\nأخذت إلارا نفسًا عميقًا ونظرت إلى الباب.\nلم تكن متأكدة مما إذا كانت تريد استعادة ذكرياتها.\nلكنها أومأت برأسها على أي حال.`

  ];

  // ================================================================
  //  APP — DO NOT CHANGE
  // ================================================================

  let currentLang = 'en';
  let currentChapter = 0;

  function getTitle(ch, lang) {
    return lang === 'en' ? ch.titleEn : lang === 'ur' ? ch.titleUr : ch.titleAr;
  }

  function getContent(ch, lang) {
    return lang === 'en' ? ch.contentEn : lang === 'ur' ? ch.contentUr : ch.contentAr;
  }

  function renderTOC() {
    const container = document.getElementById('tocContainer');
    container.innerHTML = '';
    chaptersData.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = 'toc-item';
      div.innerHTML = `<span class="num">${String(ch.number).padStart(2,'0')}</span> ${getTitle(ch, currentLang)}`;
      div.addEventListener('click', () => goTo(i));
      container.appendChild(div);
    });
  }

  function renderChapter(index) {
    const ch = chaptersData[index];
    const container = document.getElementById('chaptersContainer');
    container.innerHTML = `
      <div class="chapter-box active">
        <div class="chapter-header">
          <div class="ch-num">Chapter ${ch.number}</div>
          <h2>${getTitle(ch, currentLang)}</h2>
        </div>
        <div class="chapter-content">
          ${getContent(ch, currentLang).split('\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('')}
        </div>
      </div>
    `;
    document.getElementById('indicator').textContent = `${ch.number} / ${chaptersData.length}`;
    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === chaptersData.length - 1);
    document.getElementById('progressFill').style.width = `${((index + 1) / chaptersData.length) * 100}%`;
  }

  function goTo(index) {
    if (index < 0 || index >= chaptersData.length) return;
    currentChapter = index;
    renderChapter(index);
    document.querySelector('.chapter-box').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Language switch
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentLang = this.dataset.lang;
      document.body.className = currentLang === 'ur' ? 'ur' : currentLang === 'ar' ? 'ar' : '';
      renderTOC();
      renderChapter(currentChapter);
    });
  });

  // Nav buttons
  document.getElementById('prevBtn').addEventListener('click', () => goTo(currentChapter - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(currentChapter + 1));

  // Init
  renderTOC();
  goTo(0);
</script>
