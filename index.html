 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beneath the Lie - by Aman Fatima</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0b0a;
            color: #e5dcd3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 200, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 200, 255, 0.04) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.005) 0px, rgba(255, 255, 255, 0.005) 2px, transparent 2px, transparent 6px);
            backdrop-filter: blur(0.5px);
        }

        /* ===== SOFT GLOW ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .orb1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 140, 180, 0.08);
            top: -80px;
            left: -80px;
        }
        .orb2 {
            width: 400px;
            height: 400px;
            background: rgba(140, 180, 255, 0.06);
            bottom: -100px;
            right: -100px;
        }
        .orb3 {
            width: 200px;
            height: 200px;
            background: rgba(255, 220, 160, 0.05);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ===== GLASS CARD ===== */
        .glass {
            max-width: 920px;
            width: 100%;
            background: rgba(20, 17, 16, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 48px;
            padding: 44px 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 32px;
        }

        .header .icon {
            font-size: 28px;
            letter-spacing: 10px;
            opacity: 0.25;
            display: block;
            margin-bottom: 4px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f0e3d4 20%, #c7b09b 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .tag {
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
        }

        .header .author {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 12px;
        }
        .header .author span {
            color: #e5dcd3;
            font-style: normal;
            font-weight: 600;
            letter-spacing: 4px;
        }

        /* ===== TOC ===== */
        .toc {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 32px;
            padding: 24px 28px;
            margin: 24px 0 32px 0;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .toc h2 {
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
            font-weight: 400;
        }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2px 16px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.25);
            transition: 0.25s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
            font-size: 0.9rem;
        }

        .toc-item:hover {
            color: #fff;
            padding-left: 8px;
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        .toc-item .num {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.65rem;
            font-weight: 600;
            min-width: 32px;
            font-family: 'Inter', sans-serif;
        }

        .toc-item .title {
            font-weight: 300;
        }

        /* ===== CHAPTER DISPLAY ===== */
        .chapter-box {
            text-align: center;
            padding: 28px 0 8px;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chapter-box .big-icon {
            font-size: 44px;
            opacity: 0.15;
            margin-bottom: 8px;
            display: block;
        }

        .chapter-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            color: #f0e3d4;
            letter-spacing: 1px;
        }

        .chapter-box .sub {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .pdf-btn {
            display: inline-block;
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #d4c5b5;
            padding: 12px 36px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-decoration: none;
            transition: 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .pdf-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== NAV ===== */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.2);
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s ease;
            min-width: 120px;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .nav-btn:disabled {
            opacity: 0.1;
            cursor: not-allowed;
        }

        .indicator {
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            letter-spacing: 3px;
        }

        /* ===== PROGRESS ===== */
        .progress {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.02);
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.15));
            transition: width 0.6s ease;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.55rem;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.04);
            border-top: 1px solid rgba(255, 255, 255, 0.01);
            padding-top: 24px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .glass {
                padding: 28px 20px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 2.6rem;
            }
            .chapter-box h2 {
                font-size: 1.5rem;
            }
            .toc-grid {
                grid-template-columns: 1fr;
            }
            .nav-btn {
                padding: 10px 18px;
                min-width: 90px;
                font-size: 0.6rem;
            }
        }

        @media (max-width: 450px) {
            .glass {
                padding: 18px 14px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .header .author {
                font-size: 1rem;
            }
            .chapter-box h2 {
                font-size: 1.2rem;
            }
            .pdf-btn {
                padding: 10px 24px;
                font-size: 0.7rem;
            }
            .nav {
                flex-direction: column;
            }
            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ORBS ===== -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="glass">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <span class="icon">✦ ✦ ✦</span>
            <h1>Beneath the Lie</h1>
            <div class="tag">A Mystery Novel</div>
            <div class="author">by <span>AMAN FATIMA</span></div>
        </div>

        <!-- ===== TOC ===== -->
        <div class="toc">
            <h2>📖 Contents</h2>
            <div class="toc-grid" id="tocList"></div>
        </div>

        <!-- ===== CHAPTER ===== -->
        <div class="chapter-box" id="chapterBox">
            <span class="big-icon">📖</span>
            <h2 id="chapterTitle">Chapter 1</h2>
            <div class="sub" id="chapterDesc">Click below to read</div>
            <a href="#" class="pdf-btn" id="pdfDownloadBtn" target="_blank">📥 Download PDF</a>
        </div>

        <!-- ===== NAV ===== -->
        <div class="nav">
            <button class="nav-btn" id="prevBtn" disabled>← Back</button>
            <span class="indicator" id="chapterIndicator">1 / 20</span>
            <button class="nav-btn" id="nextBtn">Next →</button>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="footer">Beneath the Lie • Aman Fatima</div>
    </div>

    <script>
        // ================================================================
        //  🔴 APNE PDF LINKS YAHAN DAALEIN 🔴
        // ================================================================

        const pdfLinks = {
            1: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter%201.pdf",
            2: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-2.pdf",
            3: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-3.pdf",
            4: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-4.pdf",
            5: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-5.pdf",
            6: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-6.pdf",
            7: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-7.pdf",
            8: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-8.pdf",
            9: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-9.pdf",
            10: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-10.pdf",
            11: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-11.pdf",
            12: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-12.pdf",
            13: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-13.pdf",
            14: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-14.pdf",
            15: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-15.pdf",
            16: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-16.pdf",
            17: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-17.pdf",
            18: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-18.pdf",
            19: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-19.pdf",
            20: "https://raw.githubusercontent.com/amanf4250-byte/beneath-the-lie/main/chapter-20.pdf"
        };

        // ================================================================
        //  TITLES
        // ================================================================

        const titles = [
            "The Message",
            "The Pieces That Never Fit",
            "Shadows of Yesterday",
            "The Cost of Power",
            "Echoes in the Dark",
            "Old Photographs",
            "The Ring",
            "What He Built",
            "You Will Know Soon",
            "The Same Fragrance",
            "The Lie",
            "The Things You Were Never Told",
            "Questions",
            "The Missing Piece",
            "The First Clue",
            "The Secret She Never Told",
            "The Memory",
            "When Everything Fell Apart",
            "The Verdict",
            "One More Chance"
        ];

        // ================================================================
        //  APP
        // ================================================================

        let current = 0;

        function renderTOC() {
            const container = document.getElementById('tocList');
            container.innerHTML = '';
            titles.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'toc-item';
                div.innerHTML = `<span class="num">Ch.${i+1}</span><span class="title">${t}</span>`;
                div.addEventListener('click', () => goTo(i));
                container.appendChild(div);
            });
        }

        function goTo(index) {
            if (index < 0 || index >= 20) return;
            current = index;
            const num = index + 1;

            document.getElementById('chapterTitle').innerText = `Chapter ${num}: ${titles[index]}`;
            document.getElementById('pdfDownloadBtn').href = pdfLinks[num] || '#';
            document.getElementById('chapterIndicator').innerText = `${num} / 20`;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === 19;
            document.getElementById('progressFill').style.width = `${(num / 20) * 100}%`;

            document.getElementById('chapterBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
        document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));

        renderTOC();
        goTo(0);
    </script>

</body>
</html>
